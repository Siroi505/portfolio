function split(el){const c=el.classList.contains('sp-c');let n=0;

 const walk=node=>[...node.childNodes].forEach(ch=>{
  if(ch.nodeType===3){const f=document.createDocumentFragment();
   ch.textContent.split(/(\s+)/).forEach(tok=>{if(!tok)return;
    if(/^\s+$/.test(tok)){f.appendChild(document.createTextNode(' '));return}
    const w=document.createElement('span');w.className='w';if(c)w.setAttribute('aria-hidden','true');
    (c?[...tok]:[tok]).forEach(u=>{const k=document.createElement('span');k.className='c';k.style.setProperty('--i',n++);k.textContent=u;w.appendChild(k)});
    f.appendChild(w)});
   node.replaceChild(f,ch)}
  else if(ch.nodeType===1&&ch.tagName!=='BR')walk(ch)});
 walk(el)}

const RMq=false;
let navRun=false,navCancel=false;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function arrive(sec){
 document.body.classList.remove('navigating');
 const els=$$('.rv,.tx',sec);els.forEach(e=>e.classList.remove('in'));void sec.offsetWidth;
 els.forEach(e=>{if(e.classList.contains('rv')&&!e.closest('[hidden]'))e.classList.add('in')});
 els.forEach(e=>{if(e.classList.contains('tx')&&!e.closest('[hidden]'))e.classList.add('in');const b=$('b[data-n]',e);b&&count(b)});
 
 $$('.rv:not(.in),.tx:not(.in)').forEach(e=>{const r=e.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0&&!e.closest('[hidden]'))show(e)});
 if(sec.id==='home'&&window.__kick)window.__kick();

function goTo(sec){
 const maxY=document.documentElement.scrollHeight-innerHeight;
 const y=Math.max(0,Math.min(maxY,sec.id==='home'?0:sec.getBoundingClientRect().top+scrollY-90));
 links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==="#"+sec.id));
 if(RMq||Math.abs(y-scrollY)<4){scrollTo(0,y);arrive(sec);return}
 if(navRun)return;
 navRun=true;navCancel=false;
 const y0=scrollY,d=y-y0,dur=Math.min(1300,Math.max(800,Math.abs(d)*.5)),t0=performance.now();
 document.body.classList.add('navigating');
 $$('.rv,.tx',sec).forEach(e=>e.classList.remove('in'));
 const stop=()=>{navCancel=true};
 ['wheel','touchstart','keydown'].forEach(n=>addEventListener(n,stop,{once:true,passive:true}));
 (function f(now){
  const k=Math.min((now-t0)/dur,1);
  if(!navCancel)scrollTo(0,y0+d*ease(k));
  if(k<1&&!navCancel)requestAnimationFrame(f);
  else{navRun=false;arrive(sec)}})(t0);
}
